<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Rating Component</title>
</head>

<body>
  <div class="container">
    <div class="card bg-light border-0 rounded-4 shadow-lg mt-5">
      <div class="card-body">
        <div class="row p-5">
          <div class="col-7">
            <h2>What others think about the product</h2>
          </div>
          <div class="col-5">
            <div class="card">
              <div class="card-body text-center">
                <h3 class="display-5 fw-semibold"><i class="text-warning  fa-solid fa-star"></i>4.8</h3>
                <p>Average Raing</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Search Bar -->
        <div class="row">
          <div class="col-12">

            <div class="input-group input-group-lg">
              <span class="rounded-start-5 input-group-text" id="inputGroup-sizing-lg"><i
                  class="fa-solid fa-magnifying-glass-minus"></i></span>
              <input type="text" class="form-control rounded-end-5" placeholder="Search Review">
            </div>
          </div>
        </div>
        <!-- Raing distribute -->
        <div class="row p-5">
          <div class="col-12">
            <h2>Rating</h2>
            <!-- for level five -->
            <div class="d-flex align-items-center gap-1">
              <span>5</span><i class="text-warning  fa-solid fa-star"></i>
              <div class="progress" style="height: 10px; width: 100%;" role="progressbar" aria-label="Basic example"
                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning" style="width: 80% ; "></div>
              </div>
            </div>
            <!-- level four -->
             <div class="d-flex align-items-center gap-1">
              <span>4</span><i class="text-warning  fa-solid fa-star"></i>
              <div class="progress" style="height: 10px; width: 100%;" role="progressbar" aria-label="Basic example"
                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning" style="width: 60% ; "></div>
              </div>
            </div>
            <!-- level Three -->
             <div class="d-flex align-items-center gap-1">
              <span>3</span><i class="text-warning  fa-solid fa-star"></i>
              <div class="progress" style="height: 10px; width: 100%;" role="progressbar" aria-label="Basic example"
                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning" style="width: 20% ; "></div>
              </div>
            </div>
            <!-- level two -->
             <div class="d-flex align-items-center gap-1">
              <span>2</span><i class="text-warning  fa-solid fa-star"></i>
              <div class="progress" style="height: 10px; width: 100%;" role="progressbar" aria-label="Basic example"
                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning" style="width: 10% ; "></div>
              </div>
            </div>
            <!-- level one -->
             <div class="d-flex align-items-center gap-1">
              <span>1</span><i class="text-warning  fa-solid fa-star"></i>
              <div class="progress" style="height: 10px; width: 100%;" role="progressbar" aria-label="Basic example"
                aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar bg-warning" style="width: 27% ; "></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
